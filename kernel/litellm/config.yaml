# ============================================================================
# LITELLM HYBRID ENGINE CONFIG (DB Models + YAML Aliases & MCPs)
#
# File Path: /mnt/cache/config/workspace/AI-Operating-System/kernel/litellm/config.yaml
# ============================================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  override_db_settings: false

litellm_settings:
  require_auth_for_metrics_endpoint: false
  set_verbose: false
  drop_params: false
  request_timeout: 300
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

  # --- SECURITY OVERRIDE ---
  enable_mcp_tool_permission_checks: false

  # ========================================================================
  # IN-FLIGHT CACHING LAYER (Redis - exact match)
  # ========================================================================
  cache: true
  cache_params:
    type: redis
    host: os.environ/INT_IP_REDIS
    port: 6379
    password: os.environ/REDIS_PASSWORD
    namespace: "jarvis_cache"
    ttl: 1800

  # ========================================================================
  # SEMANTIC TOOL FILTERING (The VRAM Saver - protects 3050 allocation)
  # ========================================================================
  #mcp_semantic_tool_filter:
  #  enabled: false
  #  embedding_model: "ollama/nomic-embed-text:v1.5"
  #  similarity_threshold: 0.3
  #  top_k: 5

router_settings:
  routing_strategy: simple-shuffle
  # Without this, LiteLLM's `order:` field on the two "j.a.r.v.i.s." deployments
  # below is NOT guaranteed to be honored under simple-shuffle — meaning traffic
  # could silently land on the $5-budget NVIDIA fallback instead of always
  # preferring the local Ollama deployment (order: 1) first.
  enable_pre_call_checks: true
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 2
    TimeoutErrorAllowedFails: 2
    InternalServerErrorAllowedFails: 2

# ============================================================================
# YAML MODEL LIST (Core Hardware + Client Aliases with Tool-Use Enforced)
# ============================================================================
model_list:
  - model_name: j.a.r.v.i.s.
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b-instruct
      custom_llm_provider: ollama_chat
      api_base: os.environ/OLLAMA_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY
      num_ctx: 8192
      temperature: 0.2
      stream: true
      repeat_penalty: 1.3
      repeat_last_n: 256
      keep_alive: -1
      request_timeout: 300
      order: 1
    model_info:
      support_tool_use: true
      supported_openai_params: ["tools", "tool_choice", "response_format"]

  - model_name: j.a.r.v.i.s.
    litellm_params:
      model: meta/llama-3.3-70b-instruct
      custom_llm_provider: openai
      api_base: "https://integrate.api.nvidia.com/v1"
      api_key: os.environ/NVIDIA_API_KEY
      temperature: 0.2
      top_p: 0.7
      max_tokens: 1024
      stream: false
      order: 2
      max_budget: 5.00
      budget_duration: 30d
    model_info:
      support_tool_use: true
      supported_openai_params: ["tools", "tool_choice", "response_format"]

  - model_name: ollama/nomic-embed-text:v1.5
    litellm_params:
      model: ollama/nomic-embed-text:v1.5
      custom_llm_provider: ollama
      api_base: os.environ/OLLAMA_API_BASE
      api_key: os.environ/LITELLM_MASTER_KEY
    model_info:
      mode: embedding

  - model_name: claude-3-5-sonnet-20240620
    litellm_params:
      model: openai/system-agent
      api_key: os.environ/SYSTEM_AGENT_KEY
      api_base: os.environ/SYSTEM_AGENT_API_BASE
      drop_params: false
      stream: true
      temperature: 0.2
      num_retries: 5
      request_timeout: 300
    model_info:
      base_model: anthropic/claude-3-5-sonnet-20240620
      is_alias_for: "j.a.r.v.i.s."
      litellm_provider: openai
      support_tool_use: true
      supported_openai_params: ["tools", "tool_choice", "response_format"]

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: openai/system-agent
      api_key: os.environ/SYSTEM_AGENT_KEY
      api_base: os.environ/SYSTEM_AGENT_API_BASE
      drop_params: false
      stream: true
      temperature: 0.2
      num_retries: 5
      request_timeout: 300
    model_info:
      base_model: anthropic/claude-3-5-sonnet
      is_alias_for: "j.a.r.v.i.s."
      litellm_provider: openai
      support_tool_use: true
      supported_openai_params: ["tools", "tool_choice", "response_format"]

# ============================================================================
# AGENT TO AGENT HUB SPECIFICATION
# ============================================================================
agents:
  - agent_name: system-agent
    id: "a2a/395d8b98-9849-4a3e-a092-c2517d75410f"
    agent_card_params:
      name: "system-agent"
      version: "1.1.0"
      url: os.environ/SYSTEM_AGENT_API_BASE
      protocolVersion: "1.0"
      description: "Harness SYSTEM-AGENT - Dynamic Semantic Hub"

# ============================================================================
# SEARCH TOOLS (Native Web Search Hub)
# ============================================================================
search_tools:
  - search_tool_name: brave-search
    litellm_params:
      search_provider: brave
      api_key: os.environ/BRAVE_API_KEY
      count: 5
      safesearch: "moderate"

# ============================================================================
# MCP SERVERS (1:1 Native Namespaces & Env Mapping)
# ============================================================================
mcp_servers: {}
# ============================================================================
# SKILLS HUB (Passive UI Directory)
# ============================================================================
skills_settings:
  enable_skills_hub: true
  marketplace_url: "https://litellm.nestworks.duckdns.org/claude-code/marketplace.json"

ui_settings:
  model_hub_useful_links:
    - display_name: "qdrant_skills"
      url: "https://github.com/qdrant/skills"
    - display_name: "mcp_server_qdrant"
      url: "https://github.com/qdrant/mcp-server-qdrant"
    - display_name: "litellm_mcp_docs"
      url: "https://docs.litellm.ai/docs/mcp"
    - display_name: "litellm_plugin_docs"
      url: "https://docs.litellm.ai/docs/tutorials/claude_code_plugin_marketplace"
    - display_name: "agent-skills"
      url: "https://github.com/VoltAgent/awesome-agent-skills"

# ============================================================================
