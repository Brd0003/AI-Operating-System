services:
  redis:
    image: redis:${VERSION_REDIS:-7}
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    networks:
      br0:
        ipv4_address: ${IP_REDIS}
        mac_address: ${MAC_REDIS}
      nestworks:
        ipv4_address: ${INT_IP_REDIS}
    volumes:
      - /mnt/cache/appdata/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5