services:
  postgres-shared:
    image: postgres:${VERSION_POSTGRES:-16}
    container_name: postgres-shared
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      LITELLM_DB_USER: ${LITELLM_DB_USER}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
      OPEN_WEBUI_DB_USER: ${OPEN_WEBUI_DB_USER}
      OPEN_WEBUI_DB_PASSWORD: ${OPEN_WEBUI_DB_PASSWORD}
    volumes:
      - /mnt/cache/appdata/postgres-shared-recordsize-16k:/var/lib/postgresql/data
      - /mnt/cache/config/workspace/AI-Operating-System/kernel/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    networks:
      br0:
        ipv4_address: ${IP_DB_SHARED}
        mac_address: ${MAC_DB_SHARED}
      nestworks:
        ipv4_address: ${INT_IP_DB_SHARED}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
