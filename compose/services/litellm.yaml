services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:${VERSION_LITELLM:-main-stable}
    container_name: litellm
    restart: unless-stopped
    command:
      - "--config=/app/config.yaml"
    ports:
      - "4000:4000"
    environment:
      SYSTEM_AGENT_KEY: "${SYSTEM_AGENT_KEY}"
      DATABASE_URL: "postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@${INT_IP_DB_SHARED}:5432/litellm"
      OLLAMA_API_BASE: "http://${INT_IP_OLLAMA}:11434"
      SYSTEM_AGENT_API_BASE: "http://${INT_IP_SYSTEM_AGENT}:10001"
      STORE_MODEL_IN_DB: "True"
      # --- Add Cert Trust ---
      REQUESTS_CA_BUNDLE: "/certs/caddy-ca-bundle.pem"
      SSL_CERT_FILE: "/certs/caddy-ca-bundle.pem"
    env_file:
      - /mnt/cache/config/workspace/AI-Operating-System/.env
    networks:
      br0:
        ipv4_address: ${IP_LITELLM}
        mac_address: ${MAC_LITELLM}
      nestworks:
        ipv4_address: ${INT_IP_LITELLM}
    volumes:
      - /mnt/cache/config/workspace/AI-Operating-System/kernel/litellm/config.yaml:/app/config.yaml:ro
      - /mnt/cache/config/workspace/AI-Operating-System/.certs/caddy-ca-bundle.pem:/certs/caddy-ca-bundle.pem:ro
    depends_on:
      postgres-shared:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s