services:
  mcp-filesystem:
    build:
      context: ..
      dockerfile: compose/services/mcp-filesystem/Dockerfile
    container_name: mcp-filesystem
    restart: unless-stopped
    volumes:
      - /mnt/cache/config/workspace:/projects:rw
    networks:
      nestworks:
        ipv4_address: ${INT_IP_MCP_FILESYSTEM}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-github:
    image: ghcr.io/github/github-mcp-server:latest
    container_name: mcp-github
    restart: unless-stopped
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
    command: ["http", "--listen-host", "0.0.0.0", "--port", "8000", "--toolsets=repos,issues,pull_requests,code_security"]
    networks:
      nestworks:
        ipv4_address: ${INT_IP_MCP_GITHUB}

  mcp-github-health:
    image: python:3.11-alpine
    container_name: mcp-github-health
    restart: unless-stopped
    command:
      - python
      - -c
      - |
        import socket
        import time

        target = ("mcp-github", 8000)

        while True:
            try:
                with socket.create_connection(target, timeout=2):
                    pass
            except OSError:
                time.sleep(2)
            else:
                time.sleep(30)
    networks:
      nestworks:
    depends_on:
      mcp-github:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import socket
          socket.create_connection(("mcp-github", 8000), timeout=2).close()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  mcp-qdrant:
    container_name: mcp-qdrant
    build:
      context: ..
      dockerfile: compose/services/mcp-qdrant/Dockerfile
    restart: unless-stopped
    environment:
      - SYSTEM_AGENT_KEY=${SYSTEM_AGENT_KEY}
      - QDRANT_URL=${URL_QDRANT}
      - COLLECTION_NAME=qdrant_explicit_memory
      - FASTMCP_SERVER_HOST=0.0.0.0
      - FASTMCP_SERVER_PORT=8000
      - MCP_ALLOWED_HOSTS=mcp-qdrant,mcp-qdrant:8000,172.70.0.175,172.70.0.175:8000
    networks:
      br0:
        ipv4_address: ${IP_MCP_QDRANT}
        mac_address: ${MAC_MCP_QDRANT}
      nestworks:
        ipv4_address: ${INT_IP_MCP_QDRANT}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q '1F40'"]
      interval: 10s
      timeout: 5s
      retries: 5