services:
  prometheus:
    image: prom/prometheus:${VERSION_PROMETHEUS:-latest}
    container_name: prometheus
    volumes:
      - prometheus_data:/prometheus
      - /mnt/cache/config/workspace/AI-Operating-System/kernel/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: always
    networks:
      br0:
        ipv4_address: ${IP_PROMETHEUS}
        mac_address: ${MAC_PROMETHEUS}
      nestworks:
        ipv4_address: ${INT_IP_PROMETHEUS}

volumes:
  prometheus_data:
    driver: local
